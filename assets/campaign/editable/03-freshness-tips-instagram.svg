<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Fresh Fruit Daily campaign design</title><rect width="100%" height="100%" fill="#F5F7EF"/><text x="84" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#153C27">FRESH FRUIT DAILY</text><text x="788" y="106" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#153C27">FARM-FRESH FRUIT</text><polyline points="84,150 996,150" fill="none" stroke="#D0DDC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#15803D">A LITTLE CARE, MORE FRESHNESS</text><text x="78" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="108" font-weight="700" fill="#153C27">Keep the</text><text x="78" y="442" font-family="DejaVu Sans,Arial,sans-serif" font-size="108" font-weight="700" fill="#153C27">freshness</text><text x="78" y="564" font-family="DejaVu Sans,Arial,sans-serif" font-size="108" font-weight="700" fill="#153C27">going.</text><text x="84" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="400" fill="#153C27">Ripen bananas, mangoes + papayas</text><text x="84" y="696" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="400" fill="#153C27">at room temperature. Chill once ripe.</text><rect x="84" y="790" width="912" height="350" rx="28" fill="#E2EBD8"/><text x="118" y="842" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#15803D">FRESHNESS TIP</text><text x="118" y="900" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#153C27">Berries + grapes:</text><text x="118" y="945" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#153C27">unwashed, then chilled.</text><text x="118" y="1016" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weigh